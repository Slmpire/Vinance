<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner - Monthly & Yearly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background: #f8f9fa;
        }

        .view-toggle button {
            padding: 12px 30px;
            border: none;
            background: #e9ecef;
            color: #495057;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .view-toggle button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .view-toggle button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-add {
            background: #28a745;
            color: white;
        }

        .btn-add:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-remove {
            background: #dc3545;
            color: white;
            padding: 12px 15px;
        }

        .btn-remove:hover {
            background: #c82333;
        }

        .btn-calculate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 1.1em;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .expense-item,
        .income-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .summary {
            grid-column: 1 / -1;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .summary-card h3 {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-card .amount {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .summary-card.income .amount {
            color: #28a745;
        }

        .summary-card.expense .amount {
            color: #dc3545;
        }

        .summary-card.tax .amount {
            color: #ffc107;
        }

        .summary-card.net .amount {
            color: #667eea;
        }

        #expense-list,
        #income-list {
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .input-group {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Budget Planner</h1>
            <p>Plan your finances monthly or yearly with tax calculations</p>
        </header>

        <div class="view-toggle">
            <button class="active" id="monthly-btn">Monthly View</button>
            <button id="yearly-btn">Yearly View</button>
        </div>

        <div class="main-content">
            <!-- Income Section -->
            <div class="section">
                <h2>💵 Income Sources</h2>
                <div class="form-group">
                    <div class="input-group">
                        <input type="text" id="income-name" placeholder="Income source (e.g., Salary)">
                        <input type="number" id="income-amount" placeholder="Amount" step="0.01">
                        <button class="btn btn-add" id="add-income-btn">Add</button>
                    </div>
                </div>
                <div id="income-list"></div>
            </div>

            <!-- Expenses Section -->
            <div class="section">
                <h2>💳 Expenses</h2>
                <div class="form-group">
                    <div class="input-group">
                        <input type="text" id="expense-name" placeholder="Expense name (e.g., Rent)">
                        <input type="number" id="expense-amount" placeholder="Amount" step="0.01">
                        <button class="btn btn-add" id="add-expense-btn">Add</button>
                    </div>
                </div>
                <div id="expense-list"></div>
            </div>

            <!-- Tax Section -->
            <div class="section">
                <h2>📊 Tax Information</h2>
                <div class="form-group">
                    <label for="tax-rate">Tax Rate (%)</label>
                    <input type="number" id="tax-rate" placeholder="Enter tax rate" value="20" step="0.01">
                </div>
                <div class="form-group">
                    <label for="tax-type">Calculate Tax On:</label>
                    <select id="tax-type">
                        <option value="gross">Gross Income</option>
                        <option value="net">Net Income (After Expenses)</option>
                    </select>
                </div>
            </div>

            <!-- Summary Section -->
            <div class="section summary">
                <h2>📈 Financial Summary</h2>
                <button class="btn btn-calculate" id="calculate-btn">Calculate Budget</button>
                
                <div class="summary-grid" id="summary-results">
                    <div class="summary-card income">
                        <h3>Total Income</h3>
                        <div class="amount" id="total-income">$0.00</div>
                    </div>
                    <div class="summary-card expense">
                        <h3>Total Expenses</h3>
                        <div class="amount" id="total-expenses">$0.00</div>
                    </div>
                    <div class="summary-card tax">
                        <h3>Tax Amount</h3>
                        <div class="amount" id="tax-amount">$0.00</div>
                    </div>
                    <div class="summary-card net">
                        <h3>Net Balance</h3>
                        <div class="amount" id="net-balance">$0.00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Budget data storage
        let incomes = [];
        let expenses = [];
        let currentView = 'monthly'; // 'monthly' or 'yearly'

        // View toggle functionality
        document.getElementById('monthly-btn').addEventListener('click', function() {
            currentView = 'monthly';
            this.classList.add('active');
            document.getElementById('yearly-btn').classList.remove('active');
            calculateBudget();
        });

        document.getElementById('yearly-btn').addEventListener('click', function() {
            currentView = 'yearly';
            this.classList.add('active');
            document.getElementById('monthly-btn').classList.remove('active');
            calculateBudget();
        });

        // Add income
        document.getElementById('add-income-btn').addEventListener('click', addIncome);
        document.getElementById('income-amount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addIncome();
        });

        function addIncome() {
            const name = document.getElementById('income-name').value;
            const amount = parseFloat(document.getElementById('income-amount').value);

            if (name && amount > 0) {
                incomes.push({ name, amount });
                document.getElementById('income-name').value = '';
                document.getElementById('income-amount').value = '';
                renderIncomes();
            }
        }

        // Add expense
        document.getElementById('add-expense-btn').addEventListener('click', addExpense);
        document.getElementById('expense-amount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addExpense();
        });

        function addExpense() {
            const name = document.getElementById('expense-name').value;
            const amount = parseFloat(document.getElementById('expense-amount').value);

            if (name && amount > 0) {
                expenses.push({ name, amount });
                document.getElementById('expense-name').value = '';
                document.getElementById('expense-amount').value = '';
                renderExpenses();
            }
        }

        // Render incomes
        function renderIncomes() {
            const list = document.getElementById('income-list');
            list.innerHTML = '';
            incomes.forEach((income, index) => {
                const div = document.createElement('div');
                div.className = 'income-item';
                div.innerHTML = `
                    <span><strong>${income.name}</strong>: $${income.amount.toFixed(2)}</span>
                    <button class="btn btn-remove" onclick="removeIncome(${index})">Remove</button>
                `;
                list.appendChild(div);
            });
        }

        // Render expenses
        function renderExpenses() {
            const list = document.getElementById('expense-list');
            list.innerHTML = '';
            expenses.forEach((expense, index) => {
                const div = document.createElement('div');
                div.className = 'expense-item';
                div.innerHTML = `
                    <span><strong>${expense.name}</strong>: $${expense.amount.toFixed(2)}</span>
                    <button class="btn btn-remove" onclick="removeExpense(${index})">Remove</button>
                `;
                list.appendChild(div);
            });
        }

        // Remove functions
        function removeIncome(index) {
            incomes.splice(index, 1);
            renderIncomes();
            calculateBudget();
        }

        function removeExpense(index) {
            expenses.splice(index, 1);
            renderExpenses();
            calculateBudget();
        }

        // Calculate budget
        document.getElementById('calculate-btn').addEventListener('click', calculateBudget);

        function calculateBudget() {
            const multiplier = currentView === 'yearly' ? 12 : 1;
            
            const totalIncome = incomes.reduce((sum, income) => sum + income.amount, 0) * multiplier;
            const totalExpenses = expenses.reduce((sum, expense) => sum + expense.amount, 0) * multiplier;
            const taxRate = parseFloat(document.getElementById('tax-rate').value) || 0;
            const taxType = document.getElementById('tax-type').value;

            let taxAmount = 0;
            if (taxType === 'gross') {
                taxAmount = (totalIncome * taxRate) / 100;
            } else {
                const netBeforeTax = totalIncome - totalExpenses;
                taxAmount = netBeforeTax > 0 ? (netBeforeTax * taxRate) / 100 : 0;
            }

            const netBalance = totalIncome - totalExpenses - taxAmount;

            // Update display
            document.getElementById('total-income').textContent = `$${totalIncome.toFixed(2)}`;
            document.getElementById('total-expenses').textContent = `$${totalExpenses.toFixed(2)}`;
            document.getElementById('tax-amount').textContent = `$${taxAmount.toFixed(2)}`;
            document.getElementById('net-balance').textContent = `$${netBalance.toFixed(2)}`;

            // Color code net balance
            const netBalanceEl = document.getElementById('net-balance');
            if (netBalance >= 0) {
                netBalanceEl.style.color = '#28a745';
            } else {
                netBalanceEl.style.color = '#dc3545';
            }
        }
    </script>
</body>
</html>
